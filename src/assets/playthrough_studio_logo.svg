<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c283c" />
      <stop offset="50%" stop-color="#0e1422" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="30%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283548" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Red Play Frame Gradient -->
    <linearGradient id="redFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Blue Circuit Fill Gradient -->
    <radialGradient id="blueCircuitBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Silver Play Triangle Gradient -->
    <linearGradient id="silverPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)" rx="16" />

  <!-- Brushed Metal Horizontal Texture Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Centered Shield & Traces Group -->
  <g transform="translate(0, 40)">
    <!-- Left Side Extended Circuit Traces -->
    <g stroke="#334155" stroke-width="3" fill="none" opacity="0.8">
      <path d="M 410,220 L 310,220 L 260,170 L 120,170 L 80,210 L 20,210" />
      <path d="M 410,260 L 320,260 L 280,310 L 180,310 L 140,260 L 60,260 L 40,280 L 10,280" />
      <path d="M 410,300 L 340,300 L 300,250 L 200,250 L 170,220 L 80,220" />
      <path d="M 410,340 L 310,340 L 270,390 L 160,390 L 120,340 L 40,340" />
      <path d="M 410,380 L 330,380 L 290,330 L 190,330 L 160,360 L 60,360" />

      <circle cx="260" cy="170" r="4.5" fill="#475569" />
      <circle cx="120" cy="170" r="4.5" fill="#475569" />
      <circle cx="80" cy="210" r="4.5" fill="#38bdf8" />
      <circle cx="280" cy="310" r="4.5" fill="#475569" />
      <circle cx="140" cy="260" r="4.5" fill="#475569" />
      <circle cx="300" cy="250" r="4.5" fill="#38bdf8" />
      <circle cx="170" cy="220" r="4.5" fill="#475569" />
      <circle cx="270" cy="390" r="4.5" fill="#475569" />
      <circle cx="120" cy="340" r="4.5" fill="#38bdf8" />
    </g>

    <!-- Right Side Extended Circuit Traces -->
    <g stroke="#334155" stroke-width="3" fill="none" opacity="0.8">
      <path d="M 790,220 L 890,220 L 940,170 L 1080,170 L 1120,210 L 1180,210" />
      <path d="M 790,260 L 880,260 L 920,310 L 1020,310 L 1060,260 L 1140,260 L 1160,280 L 1190,280" />
      <path d="M 790,300 L 860,300 L 900,250 L 1000,250 L 1030,220 L 1120,220" />
      <path d="M 790,340 L 890,340 L 930,390 L 1040,390 L 1080,340 L 1160,340" />
      <path d="M 790,380 L 870,380 L 910,330 L 1010,330 L 1040,360 L 1140,360" />

      <circle cx="940" cy="170" r="4.5" fill="#475569" />
      <circle cx="1080" cy="170" r="4.5" fill="#475569" />
      <circle cx="1120" cy="210" r="4.5" fill="#38bdf8" />
      <circle cx="920" cy="310" r="4.5" fill="#475569" />
      <circle cx="1060" cy="260" r="4.5" fill="#475569" />
      <circle cx="900" cy="250" r="4.5" fill="#38bdf8" />
      <circle cx="1030" cy="220" r="4.5" fill="#475569" />
      <circle cx="930" cy="390" r="4.5" fill="#475569" />
      <circle cx="1080" cy="340" r="4.5" fill="#38bdf8" />
    </g>

    <!-- Central Shield -->
    <g>
      <!-- Shield Outer Bevel -->
      <path d="M 600,20 C 740,20 765,90 765,180 C 765,330 660,430 600,460 C 540,430 435,330 435,180 C 435,90 460,20 600,20 Z"
            fill="url(#shieldFill)" stroke="url(#shieldBorder)" stroke-width="10" stroke-linejoin="round" />

      <!-- Shield Inner Bevel Inset -->
      <path d="M 600,38 C 722,38 744,100 744,180 C 744,315 650,408 600,435 C 550,408 456,315 456,180 C 456,100 478,38 600,38 Z"
            fill="none" stroke="#0f172a" stroke-width="5" opacity="0.85" />

      <!-- Shield Internal Circuit Paths -->
      <g stroke="#38bdf8" stroke-width="1.8" opacity="0.4" fill="none">
        <path d="M 600,45 L 600,130" />
        <path d="M 505,100 L 505,160 L 540,200" />
        <path d="M 695,100 L 695,160 L 660,200" />
        <path d="M 530,290 L 565,340 L 600,340" />
        <path d="M 670,290 L 635,340 L 600,340" />
      </g>

      <!-- YouTube Play Button Box -->
      <g transform="translate(465, 130)">
        <!-- Outer Red Bezel Frame -->
        <rect x="0" y="0" width="270" height="175" rx="42" fill="url(#redFrameGrad)" stroke="#fca5a5" stroke-width="3" />
        <!-- Inner Dark Blue Glow Fill -->
        <rect x="10" y="10" width="250" height="155" rx="32" fill="url(#blueCircuitBg)" stroke="#0284c7" stroke-width="2.5" />

        <!-- Glowing Blue Circuit Board Overlay inside Play Button -->
        <g stroke="#38bdf8" stroke-width="2.5" fill="none">
          <path d="M 30,40 L 60,40 L 85,65 L 85,100" />
          <path d="M 240,40 L 210,40 L 185,65 L 185,100" />
          <path d="M 35,135 L 70,135 L 95,110 L 120,110" />
          <path d="M 235,135 L 200,135 L 175,110 L 150,110" />

          <circle cx="60" cy="40" r="3.5" fill="#38bdf8" />
          <circle cx="210" cy="40" r="3.5" fill="#38bdf8" />
          <circle cx="70" cy="135" r="3.5" fill="#38bdf8" />
          <circle cx="200" cy="135" r="3.5" fill="#38bdf8" />
        </g>

        <!-- Center Metallic Silver Play Triangle -->
        <polygon points="112,55 178,87.5 112,120" fill="url(#silverPlay)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
